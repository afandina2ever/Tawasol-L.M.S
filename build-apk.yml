name: Build APK

# يشتغل تلقائيًا مع أي push على main، وأيضًا يدويًا من تبويب Actions
# (زرار "Run workflow") في أي وقت تحب تولّد فيه ملف APK جديد.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # ملحوظة: المشروع متبعوت من غير gradlew/gradlew.bat، فبنستخدم Gradle
      # اللي الخطوة اللي فوق دي ثبّتته مباشرة بدل ./gradlew.
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: TawasolLMS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
